<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 首屏关键资源优先级预加载：浏览器比 JS 更早开始下载 -->
<link rel="preload" as="image" href="assets/A_setting/image/push_button_start.png">
<link rel="preload" as="image" href="assets/A_setting/image/push_button_answer.png">
<link rel="preload" as="image" href="assets/A_setting/image/push_button_back.png">
<link rel="preload" as="image" href="assets/A_setting/image/efback.jpg">
<title>翼遥动漫社-角色猜猜乐</title>
<style>
  /* ============================================================
     第一部分：全局样式
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; }                       /* 防止扩大的 fixed 层在某些内核撑出横向滚动条 */
  html, body {
    background: #fdf3dd;                              /* 与 efback.jpg 同系的奶油底色 */
    color: #4a3a1e;                                   /* 暖棕色正文 */
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;       /* 手机点击按钮时不闪灰色块 */
    -webkit-text-size-adjust: 100%;                 /* 禁止 iOS/安卓横屏时自动放大字号 */
  }
  html { touch-action: manipulation; }              /* 全局：消除点击 300ms 延迟，QQ 浏览器尤其需要 */
  body {
    padding: 12px;
  }
  /* 全屏背景图层：进入某个 IP 后由 JS 设置背景图；z-index:0 在最底层 */
  #bgLayer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #fdf3dd;
    background-size: cover;
    background-position: center top;   /* 从顶部对齐：竖屏手机 cover 裁切时保住背景图顶部的标题区 */
    background-repeat: no-repeat;
  }
  /* 强制横屏时 body 被 JS 精确设为旋转后的屏幕大小，且 body 有 transform，
     fixed 元素（bgLayer/overlay）的 containing block 就是 body 本身，
     所以 inset:0 正好等于旋转后的可视区域，直接铺满即可，
     不需要也不能向外扩圈——扩圈会让 cover 背景图放大数倍只露出中间一截 */
  body.force-landscape #bgLayer {
    inset: 0;
  }
  /* 背景图上的压暗遮罩：跟着 bgLayer 一起铺满 */
  #bgLayer::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(74, 48, 8, var(--bg-dim, 0.74)); /* 暖棕压暗，和橙色背景同调 */
  }
  /* 所有内容的舞台：要浮在背景层之上 */
  #app {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
  }
  .hidden { display: none !important; }

  /* ============================================================
     第二部分：首页（选择IP）
     ============================================================ */
  /* 首页整屏高度 + 纵向 flex 布局：标题和副标题固定在上方不动，
     只有下面的 IP 列表（#rangeList）内部滚动 */
  #homeScreen {
    padding-top: 12px;
    text-align: center;
    height: calc(100vh - 24px);                     /* 24 = body 上下 padding */
    height: calc(100dvh - 24px);                    /* 手机浏览器用动态视口高，更准；不支持的浏览器会自动用上一行 */
    display: flex;
    flex-direction: column;
  }
  /* 「请选择IP」：与抽奖页标题同款对话气泡，固定在左上角像素吊饰右侧。
     fixed 定位 = 背景图坐标系，缩放窗口/强制横屏都跟着背景走 */
  #homeScreen .sub {
    position: fixed;
    z-index: 5;
    left: calc(var(--bgw, 100vw) * 0.105);
    top: calc(var(--bgw, 100vw) * 0.16 - 20px);       /* 与吊饰人物头部居中 */
    padding: 8px 26px 8px 30px;
    border-radius: 999px;                             /* 椭圆气泡 */
    background: linear-gradient(180deg, #fffdf7, #ffeecd);
    border: 2px solid #f2a93b;
    outline: 1.5px dashed rgba(242, 169, 59, 0.55);   /* 内圈虚线，与弹窗票框同款 */
    outline-offset: -6px;
    box-shadow:
      0 4px 10px rgba(150, 95, 20, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    color: #5a431f;
    font-size: clamp(14px, 2.2vw, 18px);
    letter-spacing: 3px;
  }
  /* 气泡尾巴：指向左侧吊饰 */
  #homeScreen .sub::before {
    content: "";
    position: absolute;
    left: -9px;
    top: 50%;
    width: 14px;
    height: 14px;
    background: #ffefd0;
    border-left: 2px solid #f2a93b;
    border-bottom: 2px solid #f2a93b;
    transform: translateY(-50%) rotate(45deg);
  }
  /* IP 列表：气泡固定后不再占文档流，列表自己退到背景标题区的下方 */
  #rangeList {
    flex: 1;
    min-height: 0;                                  /* flex 子元素想内部滚动，必须加这一行 */
    overflow-y: auto;
    margin-top: calc(var(--bgw, 100vw) * 0.135);
  }
  /* IP 列表滚动条：细橙金样式，与主题同调 */
  #rangeList::-webkit-scrollbar { width: 8px; }
  #rangeList::-webkit-scrollbar-track { background: transparent; }
  #rangeList::-webkit-scrollbar-thumb {
    background: rgba(242, 169, 59, 0.45);
    border-radius: 4px;
  }
  #rangeList::-webkit-scrollbar-thumb:hover { background: rgba(242, 169, 59, 0.7); }

  /* 范围卡片：奶白半透明卡片 + 橙金描边，与波点背景同调。
     外观轮廓：左侧竖色条做视觉锚点，右侧“›”箭头提示可点，
     悬停时上浮+箭头右移。 */
  .range-card {
    position: relative;
    display: block;
    width: 100%;
    max-width: 520px;                               /* 手机强制横屏时布局宽度可能被拉得很宽，限住卡片不让按钮巨大 */
    margin: 0 auto 16px;
    padding: 20px 46px 20px 26px;                   /* 右侧留出箭头的位置 */
    background: linear-gradient(135deg, rgba(255, 252, 243, 0.95), rgba(255, 240, 209, 0.92));
    border: 2px solid #f2a93b;
    border-radius: 18px;
    box-shadow: 0 3px 10px rgba(196, 138, 40, 0.25), inset 0 0 0 3px rgba(255, 255, 255, 0.55);
    color: #5a431f;
    font-size: clamp(19px, 4vw, 23px);
    font-weight: bold;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    touch-action: manipulation;                        /* 触摸立即响应 */
    -webkit-tap-highlight-color: transparent;
  }
  /* 左侧竖色条：圆头短棒，像书签一样卡在卡片左缘 */
  .range-card::before {
    content: "";
    position: absolute;
    left: -2px;
    top: 14px;
    bottom: 14px;
    width: 6px;
    border-radius: 0 6px 6px 0;
    background: linear-gradient(#f7b733, #e8890c);
  }
  /* 右侧箭头：提示“点进去” */
  .range-card::after {
    content: "›";
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-54%);
    font-size: 30px;
    line-height: 1;
    color: #e8890c;
    transition: transform 0.12s ease;
  }
  /* 悬停上浮只给真正有鼠标的设备（电脑）；
     手机触屏点按后 :hover 会“粘住”不消失，导致卡片一直浮起 */
  @media (hover: hover) and (pointer: fine) {
    .range-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(196, 138, 40, 0.35), inset 0 0 0 3px rgba(255, 255, 255, 0.55);
    }
    .range-card:hover::after { transform: translateY(-54%) translateX(4px); }
  }
  .range-card:active {
    transform: translateY(1px) scale(0.99);
    filter: brightness(0.97);
    box-shadow: 0 2px 6px rgba(196, 138, 40, 0.3);
  }
  .range-card .count {
    display: inline-block;
    margin-top: 6px;
    padding: 1px 12px;
    border-radius: 999px;
    background: rgba(242, 169, 59, 0.16);
    border: 1px solid rgba(242, 169, 59, 0.35);
    font-size: 13px;
    font-weight: normal;
    color: #b08d55;
  }

  /* ============================================================
     第三部分：游戏页（标题 + 三个竖向滚轮 + 三个按钮）
     ============================================================ */
  /* 抽奖页锁一屏 + 相对定位（标题气泡以它为锚点），禁止滚动 */
  #gameScreen {
    position: relative;
    height: calc(100vh - 24px);                     /* 24 = body 上下 padding */
    height: calc(100dvh - 24px);
    display: flex;
    flex-direction: column;
    overflow: hidden;                               /* 关键：内容再高也不给页面滚动条 */
  }
  /* IP 标题：对话框气泡，固定定位在整个视口（= 背景图坐标系）左上角，
     紧贴像素吊饰右侧。不能用 absolute——#gameScreen 是居中的 760px
     窄列，相对它定位会偏到背景图中央去 */
  #gameTitle {
    position: fixed;
    z-index: 5;                                       /* 盖在滚轮区之上，防止被滚轮行遮挡 */
    left: calc(var(--bgw, 100vw) * 0.105 / var(--gz, 1));
    top: calc(var(--bgw, 100vw) * 0.16 / var(--gz, 1) - 20px);  /* 与吊饰人物头部居中 */
    padding: 8px 26px 8px 30px;
    border-radius: 999px;                             /* 椭圆气泡 */
    background: linear-gradient(180deg, #fffdf7, #ffeecd);
    border: 2px solid #f2a93b;
    outline: 1.5px dashed rgba(242, 169, 59, 0.55);   /* 内圈虚线，与弹窗票框同款 */
    outline-offset: -6px;
    box-shadow:
      0 4px 10px rgba(150, 95, 20, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.85);        /* 顶部高光 */
    color: #5a431f;
    font-size: clamp(14px, 2.2vw, 18px);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  /* 气泡尾巴：指向左侧吊饰的小尖角 */
  #gameTitle::before {
    content: "";
    position: absolute;
    left: -9px;
    top: 50%;
    width: 14px;
    height: 14px;
    background: #ffefd0;
    border-left: 2px solid #f2a93b;
    border-bottom: 2px solid #f2a93b;
    transform: translateY(-50%) rotate(45deg);
  }
  .reel-row {
    display: flex;
    align-items: center;
    margin-bottom: 7px;
  }
  /* 标题改气泡后不再占据文档流，滚轮区需要自己退到背景图标题区的下方 */
  #reelRows {
    margin-top: calc(var(--bgw, 100vw) * 0.108 / var(--gz, 1));
  }
  /* 标签牌左缘加一个圆头小橙条，与首页卡片的书签条呼应 */
  .reel-label {
    position: relative;
    flex: 0 0 4.2em;                                   /* 固定宽度，三行标签对齐 */
    text-align: center;
    font-size: clamp(15px, 3.2vw, 19px);
    font-weight: bold;
    color: #b35f00;
    margin-right: 10px;
    padding: 4px 2px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(255, 252, 243, 0.9), rgba(255, 236, 200, 0.85));
    border: 1px solid rgba(242, 169, 59, 0.5);
    box-shadow: 0 2px 5px rgba(196, 138, 40, 0.2);
    text-shadow: none;
  }
  .reel-label::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: #f2a93b;
  }
  /* 竖向滚动窗口：高 2 格。中间一格完整显示抽中的词，上下相邻的词只各露半格 */
  .reel-window {
    position: relative;
    flex: 1;
    height: calc(var(--cell-h, 60px) * 2);             /* 两格高，格子高由 JS 按屏幕算好写入 --cell-h */
    background: rgba(255, 250, 236, 0.85);            /* 奶白半透明，与背景融为一体 */
    border: 2px solid rgba(242, 169, 59, 0.6);
    border-radius: 14px;
    box-shadow: inset 0 2px 8px rgba(196, 138, 40, 0.18), 0 3px 8px rgba(196, 138, 40, 0.18);
    overflow: hidden;                                  /* 关键：裁掉窗外的文字 */
  }
  /* 老虎机滚筒质感：上下两条暖色渐变，模拟滚筒曲面明暗，
     左右两条轨道竖条，中间亮、上下暗，让窗口看起来像个“鼓” */
  .reel-window::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(242, 169, 59, 0.22), rgba(255, 255, 255, 0) 12px, rgba(255, 255, 255, 0) calc(100% - 12px), rgba(242, 169, 59, 0.22)),
      linear-gradient(180deg,
        rgba(196, 138, 40, 0.28),
        rgba(255, 255, 255, 0) 32%,
        rgba(255, 255, 255, 0) 68%,
        rgba(196, 138, 40, 0.28));
  }
  /* 正中央的金色选中框（一条与窗口同宽的横向高亮带） */
  .reel-center {
    position: absolute;
    left: 4px;
    right: 4px;
    top: 50%;
    height: var(--cell-h, 60px);
    transform: translateY(-50%);
    border: 3px solid #f59e0b;
    border-radius: 8px;
    pointer-events: none;                              /* 不挡触摸 */
  }
  /* 选中框左右两个橙色小箭头，像老虎机的指针一样指向中奖格 */
  .reel-center::before,
  .reel-center::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
  }
  .reel-center::before {
    left: -3px;
    border-right: 10px solid #f59e0b;
  }
  .reel-center::after {
    right: -3px;
    border-left: 10px solid #f59e0b;
  }
  /* 该滚轮停稳后，选中框发光提示 */
  .reel-row.done .reel-center {
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.65);
  }
  /* 滚动的文字格子：宽度占满窗口（长词可自动换行），JS 每帧改 translateY。
     初始 opacity:0（不可见），点开始后才淡入显示 */
  .reel-cell {
    position: absolute;
    left: 0;
    width: 100%;
    height: var(--cell-h, 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(15px, 3.4vw, 20px);
    font-weight: bold;
    line-height: 1.25;
    white-space: normal;                               /* 允许换行，长文字也塞得下 */
    word-break: break-word;
    padding: 0 10px;
    overflow: hidden;                                  /* 超过两行就裁掉，不影响相邻格 */
    color: #c9b48c;                                   /* 未抽中的词：暖灰 */
    opacity: 0;                                       /* 初始隐藏，避免堆叠 */
    transition: opacity 0.3s;
  }
  .reel-cell.on {
    color: #4a3a1e;                                   /* 正中央（抽中）的词：深棕加粗醒目 */
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
  }
  /* 窗口中央的“?”占位符为还没点开始时的提示 */
  .reel-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--cell-h, 60px) * 0.62);       /* 随格子高度缩放，小格子时不会撑爆 */
    font-weight: bold;
    color: #d9c49a;
    pointer-events: none;                              /* 不挡点击 */
  }
  /* 底部三个椭圆按钮 */
  .btn-bar {
    display: flex;
    justify-content: space-around;
    margin-top: 12px;                                 /* 页面走紧凑路线：固定小间距，不再沉底 */
  }
  /* 底部三个图片按钮：三张专属图（图上已自带“开始/谜底/返回”文字），
     按钮本身不再显示文字，只负责把图片铺满 */
  .oval-btn {
    width: 24%;
    max-width: 158px;
    aspect-ratio: 1292 / 727;                        /* 与底图同比例，不变形 */
    padding: 0;
    border: none;
    border-radius: 0;
    background-color: transparent;
    background-position: center;
    background-size: 100% 100%;                      /* 等比铺满按钮区域 */
    background-repeat: no-repeat;
    cursor: pointer;
    touch-action: manipulation;
    filter: drop-shadow(0 5px 9px rgba(150, 95, 20, 0.35));  /* 像素按钮浮起投影 */
    transition: transform 0.08s ease, filter 0.1s ease;
  }
  /* 三个按钮各自的图片 */
  #btnStart { background-image: url("assets/A_setting/image/push_button_start.png"); }
  #btnAnswer { background-image: url("assets/A_setting/image/push_button_answer.png"); }
  #btnBack { background-image: url("assets/A_setting/image/push_button_back.png"); }
  .oval-btn:active {
    transform: scale(0.93);                           /* 按下去缩一下，像真按钮 */
    filter: brightness(0.92);
  }
  .oval-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    filter: drop-shadow(0 9px 14px rgba(150, 95, 20, 0.4)) brightness(1.04);
  }
  /* 谜底按钮：没抽完之前图片变灰不可点 */
  .oval-btn:disabled {
    filter: grayscale(1) opacity(0.55);
    cursor: not-allowed;
  }
  /* 每个 IP 抽奖界面底部的专属提示语：做成小胶囊贴条，不再是裸文字 */
  #gameTip {
    margin: 8px auto 0;
    max-width: 520px;
    padding: 4px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px dashed rgba(217, 123, 0, 0.5);
    text-align: center;
    color: #a97b2f;
    font-size: clamp(11px, 2.6vw, 14px);               /* 字体缩小 */
    line-height: 1.5;
  }
  /* ============================================================
     第四部分：谜底弹窗
     ============================================================ */
  #overlay {
    position: fixed;
    /* 电脑端正常铺满即可，强制横屏时再扩圈（见 body.force-landscape #overlay） */
    inset: 0;
    background: rgba(96, 60, 10, 0.4);
    backdrop-filter: blur(2px);                       /* 弹窗背后轻微磨砂，层次更柔 */
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
    cursor: pointer;
    touch-action: manipulation;
    overscroll-behavior: contain;
  }
  body.force-landscape #overlay {
    inset: 0;
  }
  #overlay.show { display: flex; }
  /* 谜底弹窗：恢复居中面板样式后，宽度再次扩大到 1140px（旧版 380px 的 3 倍） */
  /* 谜底弹窗：双层边框——外圈实线橙金 + 内圈虚线细框，像奖券一样 */
  #panel {
    width: 1140px;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;                                 /* 内容太长时面板内部滚动 */
    background: linear-gradient(180deg, #fffdf7, #fff1d6);   /* 奶油渐变底 */
    border: 3px solid #f2a93b;
    border-radius: 16px;
    outline: 2px dashed rgba(242, 169, 59, 0.5);      /* 内层虚线装饰框 */
    outline-offset: -10px;
    box-shadow: 0 10px 40px rgba(120, 75, 15, 0.35);
    padding: 16px;
    text-align: center;
    cursor: default;
  }
  #popImg {
    max-width: 100%;
    max-height: 480px;                                /* 旧版 240px 的 2 倍 */
    border-radius: 12px;
    border: 3px solid #f2a93b;
    box-shadow: 0 4px 14px rgba(196, 138, 40, 0.3);
    display: none;                                    /* 没图时隐藏 */
    margin: 0 auto;
  }
  #popPlaceholder {
    height: 320px;                                    /* 旧版 160px 的 2 倍 */
    display: none;                                    /* 没图时显示 */
    align-items: center;
    justify-content: center;
    background: #f5e8cc;
    border-radius: 10px;
    color: #a98d5c;
    font-size: 16px;
    margin-bottom: 10px;
  }
  #popName {
    color: #d97b00;
    font-size: 28px;
    margin: 12px auto 8px;
    display: inline-block;
    padding: 2px 22px;
    border-bottom: 3px solid #f2a93b;                 /* 名字下加橙金短下划线，像奖牌绶带 */
    border-radius: 0 0 10px 10px;
  }
  #popHint { color: #a98d5c; font-size: 14px; }

/* ================================================================
   二、抽奖时间 / 尺寸配置
   ================================================================ */
/* 格子高度自适应：矮窗口（笔记本小窗、手机横屏）自动用小格子，整页更紧凑。
   计算结果同步到 CSS 变量 --cell-h，.reel-window/.reel-cell/.reel-center 都引用它 */
const CELL_H = (() => {
  const h = window.innerHeight || 800;
  return Math.round(Math.min(58, Math.max(42, (h - 230) / 7)));
})();
document.documentElement.style.setProperty("--cell-h", CELL_H + "px");
const WIN_H = CELL_H * 2;             // 窗口高 2 格：中间一格完整显示，上下只各露半格
const TOTAL_SPIN = 6.0;               // 一轮抽奖总耗时 6 秒
const STOP_INTERVAL = 1.0;            // 相邻滚轮停止间隔 1.0 秒
// 三个滚轮的停止时刻：第 1 个 4.0 秒停，第 2 个 5.0 秒，第 3 个 6 秒
const STOP_TIMES = [
  TOTAL_SPIN - STOP_INTERVAL * 2,
  TOTAL_SPIN - STOP_INTERVAL,
  TOTAL_SPIN
];
const SPIN_TURNS = [6, 8, 10];        // 三个滚轮滚动的“整圈数”，越靠后转得越多

/* ================================================================
   三、音效：滴答（tick）/停稳（stop）/开始解锁（unlock）
   ================================================================ */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
// 播放一个简单的合成音：频率从 f0 滑到 f1，带快速淡出包络避免爆音
function playTone(f0, f1, duration, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = "sine";
  osc.frequency.setValueAtTime(f0, now);
  osc.frequency.linearRampToValueAtTime(f1, now + duration);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}
let lastTickTime = 0;                 // 全局节流：三个滚轮同时滴答时避免音效过密
function sfxTick() {
  const now = audioCtx ? audioCtx.currentTime : 0;
  if (now - lastTickTime < 0.04) return;   // 40ms 内最多响一次滴答
  lastTickTime = now;
  playTone(1200, 850, 0.04, 0.07);
}
function sfxStop() { playTone(320, 120, 0.18, 0.22); }   // 某个滚轮停稳：低沉“咔哒”
/* ---- 进入 IP 音效：assets/A_setting/music/Ciallo.mp3 ---- */

}

/* ================================================================
   四、预加载（加快弹窗图片显示速度的核心）
   ----------------------------------------------------------------
   浏览器有内存缓存：同 URL 的图只要加载过一次，再用 new Image() 或
   <img src> 引用时直接命中缓存，瞬间显示。所以策略是：
   - 页面启动时：预加载首页背景图（已由 <link preload> 高优先级）
   - enterRange 时：预加载当前 IP 所有角色图（并发，每个 IP 就 10-15 张）
   点谜底时 img.src = xxx 直接命中缓存，不再等下载。
   ================================================================ */
const _preloaded = new Set();   // 记录已预加载的 URL，避免重复请求
function preloadImages(urls) {
  urls.forEach(u => {
    if (!u || _preloaded.has(u)) return;
    _preloaded.add(u);
    const img = new Image();
    img.src = u;                 // 触发下载，浏览器自动存进内存缓存
  });
}
/* ================================================================
   五、全局状态变量
   ================================================================ */
let currentRange = null;             // 当前选择的范围对象
let reelItems = [[], [], []];        // 三个滚轮各自的词库
let geometry = [null, null, null];   // 三个滚轮的尺寸信息（窗口高、格子元素等）
let offsets = [0, 0, 0];             // 三个滚轮当前已经向下滚过的距离（px）
let resultIndexes = [null, null, null]; // 抽完后三个滚轮停在的词下标（没抽过为 null）
let answer = null;                   // 本轮抽中的角色对象（谜底）
let state = "idle";                  // idle：空闲等待；spinning：抽奖中
let startOffsets = [0, 0, 0];        // 本轮开始时各滚轮的距离
let distances = [0, 0, 0];           // 本轮各滚轮总共要滚多远
let startTime = 0;                   // 本轮开始的时间戳
let rafId = null;                    // requestAnimationFrame 的编号
let lastTickOffset = [0, 0, 0];      // 上次滴答声时各滚轮的位置
let stopSounded = [false, false, false]; // 各滚轮停止音是否已响
/* ================================================================
   五、常用工具函数
   ================================================================ */
const $ = id => document.getElementById(id);
// 缓动函数：开始快、结尾平滑减速（先快后慢才有“刹车感”）
function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

// 从一个范围自动收集三个滚轮的词库（按首次出现的顺序，自动去重）
function buildReelItems(range) {
  // 如果配置里手写了 reels，就直接用手写的
  if (range.reels) return range.reels.map(list => list.slice());
  const lists = [[], [], []];
  range.characters.forEach(ch => {
    ch.attrs.forEach((word, i) => {
      if (!lists[i].includes(word)) lists[i].push(word);
    });
  });
  return lists;
}
/* ================================================================
   六、首页：生成范围卡片
   ================================================================ */
function renderHome() {
  const box = $("rangeList");
  box.innerHTML = "";
  RANGES.forEach((range, idx) => {
    const btn = document.createElement("button");
    btn.className = "range-card";
    btn.innerHTML = range.name +
      '<span class="count">共 ' + range.characters.length + ' 个角色</span>';
    btn.addEventListener("click", () => enterRange(idx));
    box.appendChild(btn);
  });
}
/* ================================================================
   七、进入 / 离开某个抽奖范围（IP）
   ================================================================ */
function enterRange(idx) {
  playCiallo();                       // 首页点击 IP 后播放 Ciallo.mp3
  currentRange = RANGES[idx];
  reelItems = buildReelItems(currentRange);
  // 切换这个 IP 的背景图（没配就恢复默认底色）
  $("bgLayer").style.backgroundImage =
    currentRange.background ? 'url("' + currentRange.background + '")' : "none";
  // 抽奖页遮罩浓度：0 = 完全透明显示原图（和首页 HOME_DIM 一样，想压暗可改成 0.74）
  document.body.style.setProperty("--bg-dim", "0");
  // 标题、三行“左标签 + 右窗口”、底部专属提示语
  $("gameTitle").textContent = currentRange.title;
  $("gameTip").textContent = currentRange.tip || "";
  const wrap = $("reelRows");
  wrap.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const row = document.createElement("div");
    row.className = "reel-row";
    row.innerHTML =
      '<div class="reel-label">' + currentRange.labels[i] + '</div>' +
      '<div class="reel-window"><div class="reel-center"></div></div>';
    wrap.appendChild(row);
  }
  // 重置状态
  answer = null;
  offsets = [0, 0, 0];
  resultIndexes = [null, null, null];
  state = "idle";
  $("btnAnswer").disabled = true;
  $("btnStart").disabled = false;
  closePopup();
  // 切换页面显示
  $("homeScreen").classList.add("hidden");
  $("gameScreen").classList.remove("hidden");
  // 元素插入页面后构建滚轮，但初始只放“?”占位符，不显示格子（避免挤成一团）
  for (let i = 0; i < 3; i++) {
    rebuildReel(i);
    const win = getWindowEl(i);
    // 清掉可能残留的旧占位符，再加一个新的
    win.querySelectorAll(".reel-placeholder").forEach(el => el.remove());
    const ph = document.createElement("span");
    ph.className = "reel-placeholder";
    ph.textContent = "?";
    win.appendChild(ph);
  }
  fitLandscape();                    // 页面高度变了，重新计算横屏缩放
  // 预加载当前 IP 所有角色图：浏览器并发下载，点谜底时直接命中缓存
  preloadImages(currentRange.characters.map(c => c.image).filter(Boolean));
}
function goHome() {
  // 返回首页：若正在抽奖，先停掉动画
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  state = "idle";
  stopHappy();                       // 抽奖中途点“返回”时也要停掉循环音效
  closePopup();
  // 首页恢复首页背景图（没配就是默认底色）和首页遮罩浓度
  $("bgLayer").style.backgroundImage =
    HOME_BACKGROUND ? 'url("' + HOME_BACKGROUND + '")' : "none";
  document.body.style.setProperty("--bg-dim", HOME_DIM);
  $("gameScreen").classList.add("hidden");
  $("homeScreen").classList.remove("hidden");
  fitLandscape();                    // 页面高度变了，重新计算横屏缩放
}
/* ================================================================
   八、竖向滚轮的构建与逐帧渲染
   ================================================================ */
function getWindowEl(i) {
  return $("reelRows").children[i].querySelector(".reel-window");
}
// （重新）构建第 i 个滚轮的格子
function rebuildReel(i) {
  const win = getWindowEl(i);
  const items = reelItems[i];
  const circumference = items.length * CELL_H;   // 滚过一整组词的长度
  // 至少复制几份才能铺满“窗口 + 上下各留一格”
  let repeat = Math.max(1, Math.ceil((WIN_H + 2 * CELL_H) / circumference));
  const stripH = circumference * repeat;         // 取模周期
  // 清掉旧格子，重新建
  win.querySelectorAll(".reel-cell").forEach(el => el.remove());
  const cells = [];
  for (let c = 0; c < repeat; c++) {
    for (let j = 0; j < items.length; j++) {
      const p = j * CELL_H + c * circumference;   // 该格子在带子上的基准位置
      const el = document.createElement("span");
      el.className = "reel-cell";
      el.textContent = items[j];
      win.appendChild(el);
      cells.push({ el: el, p: p });
    }
  }
  geometry[i] = { centerY: WIN_H / 2, stripH: stripH, cells: cells };
}
// 按给定 offset 摆放第 i 个滚轮的所有格子（竖向 translateY）
function renderReel(i, offset) {
  const g = geometry[i];
  g.cells.forEach(cell => {
    // JS 对负数取模会得到负数，先加一个周期再取模，保证结果落在 [0, stripH)
    let rel = ((cell.p - offset) % g.stripH + g.stripH) % g.stripH;
    // 换算成“相对正中央”的位置（超过半圈就从另一边绕回来）
    if (rel > g.stripH / 2) rel -= g.stripH;
    const y = g.centerY + rel - CELL_H / 2;
    cell.el.style.transform = "translate3d(0," + y + "px,0)";
    // 只有停在正中央半格以内的词是抽中词，亮白显示；其余词全部灰色
    if (Math.abs(rel) < CELL_H / 2) cell.el.classList.add("on");
    else cell.el.classList.remove("on");
  });
}
/* ================================================================
   九、开始抽奖（核心！）
   思路：点击的一瞬间先随机选定“谜底角色”→ 三个滚轮的结局就定了，
   然后只是播放滚动动画，让它精准停在预定的格子上。
   ================================================================ */
function startSpin() {
  if (state === "spinning" || !currentRange) return;
  ensureAudio();                                // 在点击手势里初始化声音
  playHappy();                                  // 抽奖期间循环播放 happy.mp3
  // 1）先定谜底
  const pool = currentRange.characters;
  answer = pool[Math.floor(Math.random() * pool.length)];
  // 2）算出每个滚轮要停在哪个下标，并计算滚动总距离
  for (let i = 0; i < 3; i++) {
    let idx = reelItems[i].indexOf(answer.attrs[i]);
    // 防御：手写 reels 时漏了谜底的词，自动追加并重建该滚轮
    if (idx < 0) {
      reelItems[i].push(answer.attrs[i]);
      idx = reelItems[i].length - 1;
      rebuildReel(i);
    }
    resultIndexes[i] = idx;
    const g = geometry[i];
    const start = offsets[i];
    const startMod = ((start % g.stripH) + g.stripH) % g.stripH;
    // 从当前位置到目标格还差多远（保证停在正中央）
    let delta = (idx * CELL_H - startMod + g.stripH) % g.stripH;
    // 总距离 = 若干整圈 + 对齐距离
    distances[i] = SPIN_TURNS[i] * g.stripH + delta;
    startOffsets[i] = start;
    // 取消该滚轮的“停稳发光”样式
    $("reelRows").children[i].classList.remove("done");
  }
  // 3）移除“?”占位符，让格子淡入显示，准备滚动
  for (let i = 0; i < 3; i++) {
    const win = getWindowEl(i);
    win.querySelectorAll(".reel-placeholder").forEach(el => el.remove());
    win.querySelectorAll(".reel-cell").forEach(el => el.style.opacity = 1);
  }
  // 4）动画期间锁住按钮，重置音效计数
  state = "spinning";
  $("btnStart").disabled = true;
  $("btnAnswer").disabled = true;
  closePopup();
  lastTickOffset = [0, 0, 0];
  stopSounded = [false, false, false];
  // 5）开动
  startTime = performance.now();
  rafId = requestAnimationFrame(frame);
}
// 每一帧执行
function frame(now) {
  const elapsed = (now - startTime) / 1000;
  let allDone = true;
  for (let i = 0; i < 3; i++) {
    const progress = Math.min(elapsed / STOP_TIMES[i], 1);
    const offset = startOffsets[i] + distances[i] * easeOutCubic(progress);
    offsets[i] = offset;
    renderReel(i, offset);
    // 滴答声：每滚过一格（CELL_H）响一次，节奏自动由密变疏
    while (offset - startOffsets[i] - lastTickOffset[i] >= CELL_H) {
      lastTickOffset[i] += CELL_H;
      sfxTick();
    }
    if (progress >= 1) {
      // 这个滚轮停稳：发光 + 响一次咔哒
      $("reelRows").children[i].classList.add("done");
      if (!stopSounded[i]) {
        stopSounded[i] = true;
        sfxStop();
      }
    } else {
      allDone = false;
    }
  }
  if (allDone) {
    finishSpin();
  } else {
    rafId = requestAnimationFrame(frame);
  }
}
function finishSpin() {
  state = "idle";
  rafId = null;
  stopHappy();                       // 抽奖结束：停掉循环的 happy.mp3
  $("btnStart").disabled = false;   // 可以再抽一次
  $("btnAnswer").disabled = false;  // 谜底可以点了
}
/* ================================================================
   十、谜底弹窗
   ================================================================ */
function openAnswer() {
  if (!answer) return;              // 还没抽过，不响应
  playFish();                       // 点“谜底”时播放 1 次 fish.mp3
  $("popName").textContent = answer.name;
  const img = $("popImg");
  const placeholder = $("popPlaceholder");
  if (answer.image) {
    // 有图片：显示图片
    img.src = answer.image;
    img.style.display = "block";
    placeholder.style.display = "none";
  } else {
    // 没图片：隐藏图片，显示占位提示
    img.removeAttribute("src");
    img.style.display = "none";
    placeholder.style.display = "flex";
  }
  $("overlay").classList.add("show");
}
function closePopup() {
  $("overlay").classList.remove("show");
}
/* ================================================================
   十一、事件绑定
   ================================================================ */
$("btnStart").addEventListener("click", startSpin);
$("btnAnswer").addEventListener("click", openAnswer);
$("btnBack").addEventListener("click", goHome);
// 点弹窗外的暗色空白处关闭弹窗。
// 统一用 click（按下+抬起都在遮罩上），手机 QQ/微信里最稳定。
$("overlay").addEventListener("click", e => {
  if (e.target === $("overlay")) closePopup();
});

// 用浏览器内置加密接口算 SHA-256，返回十六进制字符串
async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}
function openDev() {
  $("devErr").textContent = "";
  $("devPwd").value = "";
  $("devOverlay").classList.add("show");
  $("devPwd").focus();
}
function closeDev() {
  $("devOverlay").classList.remove("show");
}
async function verifyDev() {
  // file:// 或个别老浏览器可能没有 crypto.subtle
  if (!window.crypto || !crypto.subtle) {
    $("devErr").textContent = "当前浏览器不支持校验";
    return;
  }
  const input = $("devPwd").value;
  if (!input) { $("devErr").textContent = "请输入密码"; return; }
  const hash = await sha256Hex(input);
  if (hash === DEV_HASH) {
    closeDev();
    alert("欢迎开发者--秋鸣");
  } else {
    $("devErr").textContent = "密码错误，请重试";
    $("devPwd").value = "";
    $("devPwd").focus();
  }
}
$("ver").addEventListener("click", openDev);
$("devOk").addEventListener("click", verifyDev);
$("devCancel").addEventListener("click", closeDev);
// 密码框里按回车 = 点确定
$("devPwd").addEventListener("keydown", e => {
  if (e.key === "Enter") verifyDev();
});
// 点验证弹窗外面的暗色区域关闭
$("devOverlay").addEventListener("click", e => {
  if (e.target === $("devOverlay")) closeDev();
});
/* ================================================================
   十二、手机竖屏时强制横屏显示（不改任何界面布局）
   原理：竖屏时把整个 body 旋转 90°，内容永远保持横屏方向；
   内容偏高时整体等比缩小到刚好放下（只是缩放，不是改布局）；
   手机横过来（横屏方向）后自动撤销，恢复正常显示。
   ================================================================ */
function fitLandscape() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  /* 计算背景图 cover 铺满 bgLayer 后的“显示宽度”，写给 --bgw：
     首页用它把“请选择IP”退到背景图自带标题区的下方 */
  function setBgw(layerW, layerH) {
    const bgw = Math.max(layerW, layerH * 1080 / 608);  // 608/1080 = efback.jpg 宽高比
    document.documentElement.style.setProperty("--bgw", bgw + "px");
  }
  // 触摸设备竖屏时强制横屏；桌面或手机已横过来则不处理。
  // 必须用 UA 判断是否手机：带触摸屏的笔记本（Windows 触屏本）maxTouchPoints 也 > 0，
  // 若只按触摸判断，桌面把窗口缩窄（高>宽）就会被误判成手机竖屏而整页旋转。
  const isMobileUA = /Android|iPhone|iPad|Mobile|HarmonyOS/i.test(navigator.userAgent);
  const needRotate = isMobileUA && vh > vw;
  const body = document.body;
  if (!needRotate) {
    body.classList.remove("force-landscape");
    body.style.width = "";
    body.style.height = "";
    body.style.transform = "";
    document.documentElement.style.overflow = "";
    /* 桌面端抽奖页防溢出：窗口太矮时把整个抽奖页等比压缩（zoom），
       保证三个按钮和提示语始终可见。
       关键：必须先清掉上一次的 zoom 再测量——zoom 生效后 scrollHeight
       返回的是缩放后的值，直接测量会误判“内容变矮”而反复清除/恢复，
       表现为浏览器缩放后页面卡在错误状态不可逆 */
    const gs = $("gameScreen");
    gs.style.zoom = "";
    gs.style.height = "";
    if (gs.classList.contains("hidden")) {
      document.documentElement.style.setProperty("--gz", 1);
    } else {
      const availH = vh - 24;                       // 24 = body 上下 padding
      const naturalH = gs.scrollHeight;             // 未缩放状态的真实内容高度
      const z = Math.min(1, availH / Math.max(naturalH, 1));
      if (z < 0.995) {
        gs.style.zoom = z;
        /* zoom 后页面逻辑高度变大，用补偿高度让页面底边仍贴住屏幕底 */
        gs.style.height = (availH / z) + "px";
        /* 标题落位用的是屏幕像素（--bgw），zoom 会把它等比缩小，
           除以 --gz 抵消，保证仍紧贴背景图标题区 */
        document.documentElement.style.setProperty("--gz", z);
      } else {
        document.documentElement.style.setProperty("--gz", 1);
      }
    }
    setBgw(vw, vh);
    return;
  }
  body.classList.add("force-landscape");
  document.documentElement.style.overflow = "hidden";
  /* 清掉桌面分支可能设置的抽奖页缩放：旋转模式下由 body 的 scale(k) 统一负责 */
  const gs = $("gameScreen");
  gs.style.zoom = "";
  gs.style.height = "";
  document.documentElement.style.setProperty("--gz", 1);
  // 第一步：旋转后可视宽度 = 屏幕高 vh，先把 body 设成这个宽度，
  // 量出内容在此宽度下的真实高度
  body.style.width = vh + "px";
  // 首页是“标题固定 + 列表内部滚动”的整屏布局，不需要按内容高度缩放，
  // 直接 k=1 填满屏幕即可；抽奖页仍按内容真实高度计算缩放
  const homeVisible = !$("homeScreen").classList.contains("hidden");
  const contentH = $("app").offsetHeight + 24;      // 24 = body 上下 padding
  // 第二步：旋转后可用的“高度”只有屏幕宽 vw，内容更高就整体等比缩小
  const k = homeVisible ? 1 : Math.min(1, vw / contentH);
  body.style.width = (vh / k) + "px";
  body.style.height = (vw / k) + "px";
  // 平移 + 旋转 + 缩放：让画面刚好铺满整个竖屏（transform-origin 在左上角）
  body.style.transform =
    "translateX(" + vw + "px) rotate(90deg) scale(" + k + ")";
  setBgw(vh / k, vw / k);                 // 旋转后 bgLayer 尺寸 = body 尺寸
}
window.addEventListener("resize", fitLandscape);
window.addEventListener("orientationchange", () => {
  fitLandscape();
  setTimeout(fitLandscape, 300);          // 部分手机浏览器转屏后尺寸更新有延迟
});
/* ================================================================
   十三、启动：渲染首页
   ================================================================ */
// 页面一打开就预加载首页背景和所有 IP 背景（数量少，瞬间完成）
const allBg = [HOME_BACKGROUND, ...RANGES.map(r => r.background)].filter(Boolean);
preloadImages(allBg);
renderHome();
// 页面一打开就应用首页背景图（没配则保持默认底色）和首页遮罩浓度
$("bgLayer").style.backgroundImage =
  HOME_BACKGROUND ? 'url("' + HOME_BACKGROUND + '")' : "none";
document.body.style.setProperty("--bg-dim", HOME_DIM);
fitLandscape();
</script>
